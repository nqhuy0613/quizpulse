<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc">
<title id="title">QuizPulse logical architecture</title>
<desc id="desc">Multiple browsers connect via Nginx to Spring Boot REST and STOMP WebSocket, backed by a MySQL database.</desc>
<defs><linearGradient id="dark" x2="1" y2="1"><stop stop-color="#172448"/><stop offset="1" stop-color="#10192b"/></linearGradient><linearGradient id="violet" x2="1" y2="1"><stop stop-color="#8577fc"/><stop offset="1" stop-color="#5f5aef"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#9b9afe" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="490" rx="22" fill="#0b1020"/><text x="48" y="51" fill="#f5f6ff" font-family="sans-serif" font-size="23" font-weight="bold">QuizPulse — Architecture</text><text x="48" y="76" fill="#8394b6" font-family="sans-serif" font-size="13">Single authoritative server · native WebSocket + STOMP · persistent MySQL</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="50" y="145" width="175" height="110" rx="17" fill="url(#dark)" stroke="#40567d"/><text x="137" y="180" fill="#7fe4d8" font-size="27">◉ ◉ ◉</text><text x="137" y="211" fill="#fff" font-size="16" font-weight="bold">Web browsers</text><text x="137" y="235" fill="#a6b5d2" font-size="12">2–12 players / room</text>
<rect x="288" y="145" width="165" height="110" rx="17" fill="url(#dark)" stroke="#47557b"/><text x="370" y="177" fill="#a99cff" font-size="24">⇄</text><text x="370" y="205" fill="#fff" font-size="16" font-weight="bold">Nginx</text><text x="370" y="231" fill="#a6b5d2" font-size="12">Static UI · Reverse proxy</text>
<rect x="513" y="117" width="250" height="170" rx="17" fill="url(#dark)" stroke="#7668db" stroke-width="2"/><rect x="533" y="131" width="210" height="31" rx="9" fill="url(#violet)"/><text x="638" y="152" fill="#fff" font-size="15" font-weight="bold">Spring Boot / Java 17</text><text x="638" y="187" fill="#f0edff" font-size="13">Room &amp; Game Engine</text><text x="638" y="211" fill="#f0edff" font-size="13">WebSocket / STOMP</text><text x="638" y="235" fill="#f0edff" font-size="13">Security · Scoring</text><text x="638" y="259" fill="#7ee4d5" font-size="13">Reconnect snapshots</text>
<rect x="820" y="145" width="145" height="110" rx="17" fill="url(#dark)" stroke="#4a958c"/><text x="892" y="179" fill="#55d9c5" font-size="27">▤</text><text x="892" y="210" fill="#fff" font-size="16" font-weight="bold">MySQL 8.4</text><text x="892" y="233" fill="#a6b5d2" font-size="12">Users / Quiz / History</text>
</g>
<g fill="none" stroke="#9b9afe" stroke-width="2.5" marker-end="url(#arrow)"><path d="M228 199 H280"/><path d="M454 199 H505"/><path d="M766 199 H812"/></g>
<g fill="none" stroke="#55d8ce" stroke-width="2" stroke-dasharray="6 7"><path d="M137 265 V340 H638 V289"/></g>
<g font-family="sans-serif" text-anchor="middle" font-size="12"><text x="258" y="187" fill="#9dacf0">HTTP</text><text x="481" y="187" fill="#9dacf0">REST</text><text x="789" y="187" fill="#78e6d2">JDBC</text><text x="373" y="331" fill="#78e6d2">STOMP subscribe / answer / private acknowledgement</text></g>
<rect x="50" y="388" width="915" height="57" rx="13" fill="#18233b" stroke="#2e405c"/><text x="75" y="412" fill="#dae7ff" font-family="sans-serif" font-size="13" font-weight="bold">Docker Compose</text><text x="75" y="430" fill="#8fa1c2" font-family="sans-serif" font-size="12">One-command startup · MySQL healthcheck · Flyway migrations · static client + Java backend</text>
</svg>
